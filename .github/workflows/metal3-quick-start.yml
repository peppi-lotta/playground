name: Metal3 Quick Start Test

on:
  workflow_dispatch:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
        description: "Runner to use for the workflow"
      timeout-minutes:
        type: number
        default: 90
        description: "Timeout in minutes"

  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        type: number
        default: 90

permissions: {}

jobs:
  test:
    name: Quick Start Test
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes || '90') }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Install libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y libvirt-daemon-system qemu-kvm virt-manager libvirt-dev

    - name: Run Quick Start Test
      # We need a new shell to pick up the new group. That is why we do the sudo -s -u $USER ...
      run: |
        sudo usermod -a -G libvirt $USER
        sudo -s -u $USER --preserve-env bash ${{ github.workspace }}/metal3-quick-start/quick-start-test.sh
